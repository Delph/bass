services:
  bass:
    build:
      context: .
      args:
        APP_VERSION: ${BASS_VERSION:-0.0.0}
        BUILD_SHA: ${BASS_BUILD_SHA:-unknown}
        BUILD_DATE: ${BASS_BUILD_DATE:-unknown}
        ROLLBAR_CLIENT_TOKEN: ${ROLLBAR_CLIENT_TOKEN:-}
      secrets:
        - rollbar_server_token
    image: bass:${BASS_VERSION:-local}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5040:80'

secrets:
  rollbar_server_token:
    environment: ROLLBAR_SERVER_TOKEN
